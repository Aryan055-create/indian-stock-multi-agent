name: Test Groww API

on:
  workflow_dispatch:

jobs:
  test-groww:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Groww connection
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
        run: |
          python -c "from agents.market_agent import market_agent; print(market_agent('RELIANCE'))"
